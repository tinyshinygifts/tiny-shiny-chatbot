# GWMS v4.1 direct build from stable v3 base
name: Build GWMS Order APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ghdm-order-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout GWMS build branch
        uses: actions/checkout@v4
        with:
          ref: gwms-order-v41

      - name: Reconstruct Android project
        run: |
          mkdir -p ghdm-order-app
          cat ghdm-order-payload/part_*.txt | base64 -d > /tmp/ghdm-order-project.zip
          unzip -q /tmp/ghdm-order-project.zip -d ghdm-order-app
          test -f ghdm-order-app/app/build.gradle

      - name: Apply GWMS v3 base
        run: |
          cat gwms-v3-patch-parts/*.txt | base64 -d > /tmp/gwms-v3-patch.zip
          unzip -oq /tmp/gwms-v3-patch.zip -d ghdm-order-app

      - name: Apply GWMS v4.1 order changes
        run: |
          cat gwms-v41-patch-parts/*.txt | base64 -d > /tmp/gwms-v41-patch.zip
          unzip -oq /tmp/gwms-v41-patch.zip -d ghdm-order-app
          cp gwms-v41/SimpleXlsxWriter.java ghdm-order-app/app/src/main/java/com/ggautoworld/ghdmorder/SimpleXlsxWriter.java
          grep -q "versionName '4.1'" ghdm-order-app/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ghdm-order-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp ghdm-order-app/app/build/outputs/apk/debug/app-debug.apk GWMS-Order-App-v4.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GWMS-Order-APK-v4.1
          path: GWMS-Order-App-v4.1.apk
          if-no-files-found: error
